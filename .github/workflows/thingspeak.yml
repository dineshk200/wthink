name: ThingSpeak Auto Update

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed so the workflow can commit state.json back

concurrency:
  group: thingspeak-update   # only one run at a time, prevents push conflicts
  cancel-in-progress: false

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send reading to ThingSpeak
        run: python send_reading.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update drift state [skip ci]"
          git pull --rebase origin main
          git push
